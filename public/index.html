<script>
const S=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
let filter="All",q="",admin=false,busy=false,revision=0,loaded=false,rateDraft=null;
let identityModule;
const identity=()=>identityModule??=import("/identity.js");
function msg(t){const l=$('lb');l.hidden=false;l.onclick=e=>{if(e.target===l)l.hidden=true};l.innerHTML=`<div class="box"><div class="t"><p>${esc(t)}</p><button class="btn" onclick="$('lb').hidden=true">OK</button></div></div>`}
window.alert=m=>setTimeout(()=>msg(m),50);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const cats=()=>['All',...new Set(S.items.map(i=>i.cat).filter(Boolean))];
function chips(){return cats().map(c=>`<button class="chip ${c===filter?'on':''}" onclick="setF(this.dataset.c)" data-c="${esc(c)}">${esc(c)}</button>`).join('')}
function grid(){
  const l=S.items.filter(i=>(filter==='All'||i.cat===filter)&&(!q||(i.name+' '+i.cat).toLowerCase().includes(q)));
  if(!l.length)return `<div class="empty">${S.items.length?'No designs found.':'New designs coming soon.'}</div>`;
  return l.map(i=>`<div class="card" onclick="openI('${i.id}')"><img loading="lazy" src="${i.img}" alt="${esc(i.name)}">${admin?`<button class="del" title="Delete" onclick="event.stopPropagation();delI('${i.id}')">×</button>`:''}<div class="i"><b>${esc(i.name)}</b><small>${esc(i.cat)}${i.wt?' · '+esc(i.wt):''}</small>${i.price?`<div class="price">₹ ${esc(i.price)}</div>`:''}</div></div>`).join('');
}
function render(){
  const sh=S.shop;
  app.innerHTML=`${topHtml()}
  <div class="hero">${sky(40)}<h1>MS Jewellers</h1><div class="orn">◆ ${sh.since?'Since '+esc(sh.since):'Fine Jewellery'} ◆</div><p>${esc(sh.tagline?.replaceAll('&amp;','&'))}</p><a class="btn" href="#collection">View Collection</a></div>
  ${admin?adminHtml():''}
  ${featHtml()}<section id="collection"><h2>Our Collection</h2><div class="tools"><input id="q" placeholder="Search designs…" value="${esc(q)}" oninput="q=this.value.toLowerCase();$('grid').innerHTML=grid()"><div class="chips" id="chips">${chips()}</div></div><div class="grid" id="grid">${grid()}</div></section>
  ${revHtml()}${shopHtml()}${footHtml()}${chatHtml()}<div id="lb" hidden></div>`;
  $('lb').hidden=true;
}
function adminHtml(){const s=S.shop;return `<div class="admin"><p id="saveStatus" role="status" aria-live="polite"></p><h3>Add new designs</h3>
  <div class="row"><input id="a_name" placeholder="Design name"><input id="a_cat" placeholder="Category (Ring, Necklace…)"><input id="a_wt" placeholder="Weight (e.g. 12 g)"><input id="a_price" placeholder="Price (optional)"></div>
  <input id="a_files" type="file" accept="image/*" multiple><p style="font-size:13px;color:var(--mute)">You can pick many photos at once; each becomes a design with these details.</p>
  <button class="btn" onclick="addI()">Add &amp; publish</button>
  ${revAdmin()}
  <h3 style="margin-top:22px">Rates (gold / silver / sab)</h3>
  <p style="font-size:13px;color:var(--mute);margin:6px 0">Naam, rate aur unit likho. Nayi rate ke liye "+ Add rate". Save karte hi upar bar me dikhega.</p>
  <div id="rateRows">${rateRows()}</div>
  <button class="btn alt" onclick="addRate()">+ Add rate</button> <button class="btn" onclick="saveRates()">Save rates</button>
  <h3 style="margin-top:22px">Logo / admin photo</h3>
  <p style="font-size:13px;color:var(--mute);margin:6px 0">Header ke gol circle par click karke photo badal sakte hain.</p>
  <button class="btn alt" onclick="rmAv()">Remove photo</button>
  <h3 style="margin-top:22px">Seller photo (footer me dikhegi)</h3>
  <input type="file" accept="image/*" onchange="setSeller(this)"> <button class="btn alt" onclick="rmSeller()">Remove seller photo</button>
  <h3 style="margin-top:22px">Shop photo + location</h3>
  <p style="font-size:13px;color:var(--mute);margin:6px 0">Shop ki photo yahan se daalo (ya "Visit Our Shop" me photo par click karo). Address aur Google Maps link neeche Shop details me hai.</p>
  <input type="file" accept="image/*" onchange="setShopPic(this)"> <button class="btn alt" onclick="rmShopPic()">Remove shop photo</button>
  <h3 style="margin-top:22px">Shop details</h3>
  <div class="row"><input id="s_phone" placeholder="Phone" value="${esc(s.phone)}"><input id="s_wa" placeholder="WhatsApp (91XXXXXXXXXX)" value="${esc(s.whatsapp)}"><input id="s_addr" placeholder="Shop address" value="${esc(s.address)}"><input id="s_map" placeholder="Google Maps link (optional)" value="${esc(s.maploc)}"><input id="s_seller" placeholder="Seller name (optional)" value="${esc(s.sname)}"><input id="s_since" placeholder="Since (year, optional)" value="${esc(s.since)}"><input id="s_ig" placeholder="Instagram link (optional)" value="${esc(s.ig)}"><input id="s_fb" placeholder="Facebook link (optional)" value="${esc(s.fb)}"><input id="s_tw" placeholder="Twitter / X link (optional)" value="${esc(s.tw)}"><input id="s_yt" placeholder="YouTube link (optional)" value="${esc(s.yt)}"></div>
  <button class="btn alt" onclick="saveShop()">Save shop details</button></div>`}

if(!Array.isArray(S.shop.rates))S.shop.rates=[{l:'Gold 24K',v:'',u:'/10 g'},{l:'Gold 22K',v:'',u:'/10 g'},{l:'Gold 18K',v:'',u:'/10 g'},{l:'Silver',v:'',u:'/kg'}];
if(!S.shop.m18){if(!S.shop.rates.some(r=>/18\s*k/i.test(r.l||''))){const i=S.shop.rates.findIndex(r=>/22\s*k/i.test(r.l||''));S.shop.rates.splice(i>=0?i+1:S.shop.rates.length,0,{l:'Gold 18K',v:'',u:'/10 g'})}S.shop.m18=1}
const fmt=v=>{const t=String(v==null?'':v).trim(),n=Number(t.replace(/[,₹\s]/g,''));return t!==''&&isFinite(n)?'₹'+n.toLocaleString('en-IN'):esc(t)};
const rated=()=>S.shop.rates.filter(r=>r.l&&String(r.v==null?'':r.v).trim()!=='');
const stamp=()=>{const t=S.shop.updated;if(!t)return '';const d=new Date(t);return isNaN(d)?'':d.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})};
function avHtml(){const a=S.shop.avatar,inner=a?`<img src="${a}" alt="MS Jewellers">`:logo();
  return admin?`<label class="av" title="Photo change karein">${inner}<input type="file" accept="image/*" onchange="setAv(this)"></label>`:`<span class="av">${inner}</span>`}
function topHtml(){

  const rate=(rs.length||admin)?`<div class="rb"><div class="rr"><span class="rl">↗ Rates</span>${rs.length?rs.map(r=>`<span class="rt">${esc(r.l)} <b>${fmt(r.v)}</b>${esc(r.u||'')}</span>`).join(''):'<span class="rt">Rates not set yet (Admin → Rates)</span>'}<button class="fr" onclick="showRates()">Full rate →</button></div>${st?`<div class="rs">Shop rate · updated ${esc(st)}</div>`:''}</div>`:'';

}

function shrink(file,square){return new Promise((resolve,reject)=>{
  const image=new Image(),url=URL.createObjectURL(file);
  const unreadable=()=>reject(new Error('Could not read the photo. Try a JPEG or PNG.'));
  image.onload=()=>{
    URL.revokeObjectURL(url);
    const canvas=document.createElement('canvas'),size=Math.min(image.width,image.height),scale=Math.min(1,800/Math.max(image.width,image.height));
    canvas.width=square?240:Math.max(1,Math.round(image.width*scale));
    canvas.height=square?240:Math.max(1,Math.round(image.height*scale));
    const context=canvas.getContext('2d');
    if(!context){unreadable();return}
    if(square)context.drawImage(image,(image.width-size)/2,(image.height-size)/2,size,size,0,0,240,240);
    else context.drawImage(image,0,0,canvas.width,canvas.height);
    canvas.toBlob(blob=>blob?resolve(blob):unreadable(),'image/jpeg',.78);
  };
  image.onerror=()=>{URL.revokeObjectURL(url);unreadable()};image.src=url;
})}
async function uploadPhoto(file,square=false){

async function api(path,{method='GET',body}={}){
  const binary=body instanceof Blob;
  const response=await fetch(path,{method,cache:'no-store',credentials:'same-origin',
    ...(body===undefined?{}:{headers:{'Content-Type':binary?body.type:'application/json'},body:binary?body:JSON.stringify(body)})});
  const result=await response.json().catch(()=>null);
  if(!response.ok||result===null){const error=new Error(result?.message||'Website service is unavailable. Please try again.');error.status=response.status;throw error}
  return result;
}

async function commit(change,onSaved){
  if(!admin||busy)return;
  if(!loaded){alert('Refresh the page before saving changes.');return}
  const draft=structuredClone({shop:S.shop,items:S.items}),panel=document.querySelector('.admin');
  busy=true;panel.inert=true;$('saveStatus').textContent='Saving…';
  try{
    await change(draft);
    const result=await api('/api/catalog',{method:'PUT',body:{data:draft,revision}});
    S.shop=draft.shop;S.items=draft.items;revision=result.revision;
    onSaved?.();if(!cats().includes(filter))filter='All';
    render();$('saveStatus').textContent='Saved and published.';
  }catch(error){
    $('saveStatus').textContent='Not saved.';
    alert(error.message);
  }finally{panel.inert=false;busy=false}
}

  const spk=(x,y,c)=>`<path class='tw ${c}' fill='#fff' transform='translate(${x} ${y})' d='M0-7 2-2 7 0 2 2 0 7-2 2-7 0-2-2Z'/>`;
  const GD=(i)=>`<linearGradient id='gd${i}' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#fff3b0'/><stop offset='.45' stop-color='#e0a82e'/><stop offset='1' stop-color='#b8860b'/></linearGradient>`;
  const rg=`<svg viewBox='0 0 200 180' role='img' aria-label='Diamond ring'><defs>${GD(2)}</defs><ellipse cx='100' cy='170' rx='52' ry='6' fill='#000' fill-opacity='.3'/><ellipse cx='100' cy='115' rx='52' ry='44' fill='none' stroke='url(#gd2)' stroke-width='9'/><ellipse cx='100' cy='115' rx='46.5' ry='39' fill='none' stroke='#6b4a05' stroke-opacity='.4' stroke-width='1.6'/><path d='M56 132Q62 152 84 158' fill='none' stroke='#fff' stroke-opacity='.55' stroke-width='2.2' stroke-linecap='round'/><g fill='#eaf6ff' stroke='#e0a82e' stroke-width='1.2'><circle cx='70' cy='79' r='3'/><circle cx='130' cy='79' r='3'/><circle cx='57' cy='90' r='2.6'/><circle cx='143' cy='90' r='2.6'/><circle cx='50' cy='101' r='2.2'/><circle cx='150' cy='101' r='2.2'/></g><path d='M84 66Q100 80 116 66L112 74Q100 85 88 74Z' fill='url(#gd2)' stroke='#8a5a0a' stroke-width='.8'/><g stroke='#6fa8dc' stroke-width='.8' stroke-linejoin='round'><path d='M84 26H116L108 46H92Z' fill='#fff'/><path d='M84 26L92 46L68 46Z' fill='#bfdcf5'/><path d='M116 26L132 46L108 46Z' fill='#e6f4ff'/><path d='M68 46L92 46L100 74Z' fill='#8fc3ee'/><path d='M92 46L108 46L100 74Z' fill='#e0f1ff'/><path d='M108 46L132 46L100 74Z' fill='#7ab4e6'/></g><g fill='url(#gd2)' stroke='#8a5a0a' stroke-width='.6'><circle cx='69' cy='45' r='3'/><circle cx='131' cy='45' r='3'/><circle cx='85' cy='28' r='2.3'/><circle cx='115' cy='28' r='2.3'/></g>${spk(34,34,'')}${spk(168,44,'tw2')}${spk(100,10,'tw2')}${spk(158,138,'')}</svg>`;
  const nk=`<svg viewBox='0 0 200 170' role='img' aria-label='Gold necklace'><defs>${GD(3)}<radialGradient id='rb3' cx='.35' cy='.3' r='.8'><stop offset='0' stop-color='#ff7b8f'/><stop offset='.5' stop-color='#c2263f'/><stop offset='1' stop-color='#6e0b20'/></radialGradient></defs><path d='M44 10C54 74 146 74 156 10' fill='none' stroke='url(#gd3)' stroke-width='3' stroke-dasharray='5 2' stroke-linecap='round'/><path d='M22 10C34 120 166 120 178 10' fill='none' stroke='url(#gd3)' stroke-width='5' stroke-dasharray='6 2.4' stroke-linecap='round'/><path d='M22 10C34 120 166 120 178 10' fill='none' stroke='#fff' stroke-opacity='.45' stroke-width='1.3' stroke-dasharray='2 6.4'/><g fill='url(#gd3)' stroke='#8a5a0a' stroke-width='.8'><circle cx='22' cy='10' r='3.4'/><circle cx='178' cy='10' r='3.4'/><circle cx='31' cy='45' r='4'/><circle cx='169' cy='45' r='4'/><circle cx='42' cy='63' r='4.6'/><circle cx='158' cy='63' r='4.6'/><circle cx='68' cy='85' r='5'/><circle cx='132' cy='85' r='5'/><circle cx='100' cy='58' r='4'/></g><path d='M100 62V89' stroke='url(#gd3)' stroke-width='2'/><circle cx='100' cy='93' r='4.5' fill='url(#gd3)' stroke='#8a5a0a' stroke-width='.8'/><path d='M100 99C78 118 81 146 100 154C119 146 122 118 100 99Z' fill='url(#gd3)' stroke='#8a5a0a' stroke-width='1'/><path d='M100 111C89 124 91 140 100 145C109 140 111 124 100 111Z' fill='url(#rb3)' stroke='#f3c24b' stroke-width='1.4'/><ellipse cx='96' cy='124' rx='2.2' ry='4' fill='#fff' fill-opacity='.6'/><g fill='url(#gd3)' stroke='#8a5a0a' stroke-width='.7'><circle cx='88' cy='110' r='2.6'/><circle cx='112' cy='110' r='2.6'/><circle cx='100' cy='162' r='4'/></g><path d='M100 154V158' stroke='#b8860b' stroke-width='1.6'/>${spk(24,70,'tw2')}${spk(176,74,'')}${spk(100,36,'tw2')}</svg>`;
  return `<section id='featured'>${sky(28)}<h2>Diamond Anguthi &amp; Gold Necklace</h2><div class='dg'><div class='dc'><div class='dv'>${rg}</div><h3>Diamond Anguthi</h3><p>Solitaire aur designer diamond rings, apne budget me.</p>${b('Hello MS Jewellers, I am interested in Diamond Ring (Anguthi)')}</div><div class='dc'><div class='dv'>${nk}</div><h3>Gold Necklace</h3><p>Sone ke traditional aur designer necklace, har mauke ke liye.</p>${b('Hello MS Jewellers, I am interested in Gold Necklace')}</div></div></section>`}
let rvS=0,pend=null;
const starsH=n=>`<span class="stars"><b>${'★'.repeat(n)}</b>${'★'.repeat(5-n)}</span>`;
const reviewDate=value=>new Date(value).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
function revHtml(){
  const r=S.reviews,n=r.length,avg=n?r.reduce((a,x)=>a+x.stars,0)/n:0;
  const list=n?`<div class="rvh"><div class="rvavg">${avg.toFixed(1)}</div><div>${starsH(Math.round(avg))}<br><small>${n} customer review${n>1?'s':''}</small></div></div><div class="rvg">${r.map(x=>`<div class="rvc">${admin?`<button class="del" title="Delete" onclick="delRv('${x.id}')">×</button>`:''}${starsH(x.stars)}<p>${esc(x.text)}</p><small><b>${esc(x.name)}</b>${x.createdAt?' · '+esc(reviewDate(x.createdAt)):''}</small></div>`).join('')}</div>`:'<div class="empty">Abhi koi review nahi hai — sabse pehle aap likhiye!</div>';
  return `<section id="reviews" class="rv"><h2>Customer Testimonials</h2>${list}
  <div class="rvf"><h3>Apna review likhiye</h3><input id="rv_n" placeholder="Aapka naam" maxlength="40">
  <div class="sp5" id="rv_s">${[1,2,3,4,5].map(k=>`<button type="button" data-k="${k}" aria-label="${k} star" onclick="setRv(${k})">★</button>`).join('')}</div>
  <textarea id="rv_t" rows="3" maxlength="400" placeholder="Hamare baare me aapka anubhav…"></textarea>
  <button class="btn" id="rv_submit" onclick="sendRv()">Submit Review</button></div></section>`}
function setRv(k){rvS=k;document.querySelectorAll('#rv_s button').forEach(b=>b.classList.toggle('on',+b.dataset.k<=k))}
async function sendRv(){
  const nameInput=$('rv_n'),textInput=$('rv_t'),button=$('rv_submit');
  const name=nameInput.value.trim(),text=textInput.value.trim();
  if(!name||!rvS||!text){alert('Naam, star rating aur review teeno bharein.');return}
  button.disabled=true;
  try{
    await api('/api/reviews',{method:'POST',body:{name,text,stars:rvS}});
    nameInput.value=textInput.value='';setRv(0);
    alert('Shukriya! Aapka review owner ki approval ke baad yahan dikhega.');
  }catch(error){alert(error.message)}finally{button.disabled=false}
}
function delRv(id){return moderate(id,'DELETE')}
function revAdmin(){return `<h3 style="margin-top:22px">Customer reviews (approval)</h3><p style="font-size:13px;color:var(--mute);margin:6px 0">Customers ke naye reviews yahan aate hain. Approve karte hi sabko dikhenge.</p><button class="btn alt" onclick="loadPend()">Check new reviews</button><div id="pend">${pendHtml()}</div>`}
function pendHtml(){if(!pend)return '';if(!pend.length)return '<p style="font-size:13px">Koi naya review nahi.</p>';
  return pend.map((x,i)=>`<div class="rvc" style="margin-top:8px">${starsH(x.stars)}<p>${esc(x.text)}</p><small><b>${esc(x.name)}</b></small><p><button class="btn" onclick="apprRv(${i})">Approve</button> <button class="btn alt" onclick="rejRv(${i})">Reject</button></p></div>`).join('')}
async function loadPend(){
  if(!admin||busy)return;
  try{pend=await api('/api/reviews');if($('pend'))$('pend').innerHTML=pendHtml()}catch(error){alert(error.message)}
}
function rejRv(index){if(pend?.[index])return moderate(pend[index].id,'DELETE')}
function apprRv(index){if(pend?.[index])return moderate(pend[index].id,'PATCH')}
async function moderate(id,method){
  if(!admin||busy)return;
  busy=true;
  try{
    await api('/api/reviews/'+id,{method});
    pend=pend?.filter(review=>review.id!==id)??null;
    await loadCatalog();render();
    $('saveStatus').textContent=method==='PATCH'?'Review published.':'Review removed.';
  }catch(error){alert(error.message)}finally{busy=false}
}

render();
(async()=>{
  const catalogReady=loadCatalog().catch(()=>{});
  let callback=null,auth;
  const authLink=/^#(?:invite|recovery|confirmation|email_change)_token=/.test(location.hash);
  if(authLink||document.cookie.includes('nf_jwt=')){
    try{
      auth=await identity();
      if(authLink)callback=await auth.handleAuthCallback();
      if(!callback)admin=Boolean(await auth.getUser())&&await checkAdmin();
    }catch{if(authLink)callback={type:'invalid'}}
  }
  await catalogReady;
  const dialogOpen=!$('lb').hidden;
  if(!dialogOpen||authLink)render();
  if(callback?.type==='invite'||callback?.type==='recovery')showNewPassword(auth,callback);
  else if(authLink){
    try{await auth?.logout()}catch{}
    msg('The email link is invalid or expired. Open Admin to request a new reset link.');
  }
})();
</script>
</body></html>
